plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autostudy.helper'
    compileSdk 34

    defaultConfig {
        applicationId "com.autostudy.helper"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "1.0.22"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/auto-study.jks")
            storePassword "autostudy2026"
            keyAlias "autostudy"
            keyPassword "autostudy2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
